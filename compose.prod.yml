name: medusa-prod

networks:
  edge:
  internal:
    internal: true

volumes:
  redis_data:

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - medusa_server
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks:
      - internal

  medusa_server:
    image: ghcr.io/vetlinkr/service-medusa:${IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      WORKER_MODE: "server"
      ADMIN_DISABLED: "false"
      PORT: "9000"
      REDIS_URL: "redis://redis:6379"
    expose:
      - "9000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  medusa_worker:
    image: ghcr.io/vetlinkr/service-medusa:${IMAGE_TAG:-prod}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      WORKER_MODE: "worker"
      ADMIN_DISABLED: "true"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
